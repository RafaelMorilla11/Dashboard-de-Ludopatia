<div class="bar"><div>
<label>Género<select id="fg"></select></label><label>Edad<select id="fa"></select></label>
<label>Carrera<select id="fc"></select></label><label>Relación con apuestas<select id="fr"></select></label>
<label>Mostrar valores<span><button id="bc" class="on">Cantidad</button> <button id="bp">% del grupo</button></span></label>
<button id="rs" style="align-self:flex-end">Limpiar filtros</button></div></div>
<main><div class="guide"><strong>Probá:</strong> cambiá los filtros o hacé clic en una barra o porción para explorar ese grupo. Podés combinar selecciones y sacarlas cuando quieras. <b>n</b> indica respuestas; “% del grupo” ayuda a comparar grupos de distinto tamaño.</div><div id="activeFilters" class="active-filters" aria-live="polite"></div><div class="kpis" id="kpis"></div><div id="root"></div></main>
